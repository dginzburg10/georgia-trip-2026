<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15382f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Грузия · Вход</title>
  <style>
    :root { color-scheme: light; --pine:#15382f; --wine:#8a3947; --gold:#e0b35e; --paper:#f4efe5; --ink:#17302b; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body {
      margin:0; display:grid; place-items:center; overflow-x:hidden;
      padding:max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      color:#fffdf7; background:
        radial-gradient(circle at 92% 4%, rgba(224,179,94,.34), transparent 24rem),
        radial-gradient(circle at 5% 92%, rgba(138,57,71,.34), transparent 25rem),
        linear-gradient(145deg, #102d25, #1d4a3d 58%, #4d4c36);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    body::before { content:""; position:fixed; width:350px; height:350px; right:-190px; top:-190px; border:1px solid rgba(255,255,255,.2); border-radius:50%; box-shadow:0 0 0 62px rgba(255,255,255,.035),0 0 0 124px rgba(255,255,255,.02); }
    .gate { width:min(100%, 430px); padding:34px 30px; border:1px solid rgba(255,255,255,.18); border-radius:28px; background:rgba(255,255,255,.1); box-shadow:0 28px 80px rgba(0,0,0,.25); backdrop-filter:blur(18px); }
    .mark { display:grid; width:54px; height:54px; margin-bottom:28px; place-items:center; border-radius:18px; color:var(--pine); background:var(--gold); font-size:24px; box-shadow:0 10px 25px rgba(224,179,94,.22); }
    .eyebrow { margin:0 0 9px; color:#f0ca7d; font-size:12px; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0 0 13px; font-family:Georgia,"Times New Roman",serif; font-size:clamp(40px,12vw,55px); font-weight:500; line-height:.96; letter-spacing:-.045em; }
    .intro { margin:0 0 27px; color:rgba(255,255,255,.7); font-size:15px; line-height:1.55; }
    label { display:block; margin-bottom:8px; color:rgba(255,255,255,.76); font-size:12px; font-weight:800; }
    .input-wrap { display:grid; grid-template-columns:1fr auto; gap:9px; }
    input { width:100%; min-width:0; height:54px; padding:0 17px; color:var(--ink); border:2px solid transparent; border-radius:16px; outline:none; background:#fffdf8; font:700 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.16em; }
    input:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(224,179,94,.16); }
    button { min-width:112px; height:54px; padding:0 18px; color:#fff; border:0; border-radius:16px; background:var(--wine); font:800 14px/1 inherit; cursor:pointer; box-shadow:0 10px 24px rgba(88,32,44,.25); }
    button:disabled { opacity:.66; cursor:wait; }
    .status { min-height:22px; margin:11px 0 0; color:#ffd7c9; font-size:13px; }
    .privacy { margin:18px 0 0; padding-top:17px; color:rgba(255,255,255,.48); border-top:1px solid rgba(255,255,255,.13); font-size:11px; line-height:1.45; }
    @media (max-width:420px) {
      .gate { padding:29px 21px; border-radius:24px; }
      .input-wrap { grid-template-columns:1fr; }
      button { width:100%; }
    }
  </style>
</head>
<body>
  <main class="gate">
    <div class="mark" aria-hidden="true">⌁</div>
    <p class="eyebrow">Georgia ’26 · Private plan</p>
    <h1>План поездки</h1>
    <p class="intro">Введите пароль, чтобы открыть маршрут, миникарты и бюджет поездки.</p>
    <form id="unlock-form">
      <label for="password">Пароль</label>
      <div class="input-wrap">
        <input id="password" name="password" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" enterkeyhint="go" required autofocus>
        <button id="unlock" type="submit">Открыть</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="privacy">Содержимое маршрута зашифровано и расшифровывается только в вашем браузере.</p>
  </main>

    const iterations = 250000;
    const form = document.getElementById('unlock-form');
    const input = document.getElementById('password');
    const button = document.getElementById('unlock');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Открываем…';
      button.disabled = true;
      input.disabled = true;
      try {
        const material = await crypto.subtle.importKey(
          'raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']
        );
        const key = await crypto.subtle.deriveKey(
          { name:'PBKDF2', salt, iterations, hash:'SHA-256' },
          material,
          { name:'AES-GCM', length:256 },
          false,
          ['decrypt']
        );
        const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, payload);
        const html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = 'Неверный пароль. Попробуйте ещё раз.';
        input.value = '';
        input.disabled = false;
        button.disabled = false;
        input.focus();
      }
    });
  </script>
